name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install ruff==0.17.4 pytest basedpyright
          pip install -r requirements.txt

      - name: Ruff
        run: |
          python -m ruff format --check .
          python -m ruff check .

      # basedpyright exits non-zero on warnings; bash -e would stop before we read errorCount from JSON.
      - name: Basedpyright (curated modules, errors only)
        run: |
          OUT="${RUNNER_TEMP}/basedpyright.json"
          python -m basedpyright --outputjson \
            native/_experimental/python/sdx_native/native_tools.py \
            diffusion/schedules.py \
            examples/run_baseline_eval.py \
            utils/runtime.py \
            training/cli.py \
            utils/generation/sample_cli_parser.py \
            > "$OUT" || true
          python - "$OUT" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1], encoding="utf-8-sig"))
          s = d.get("summary") or {}
          ec, wc = int(s.get("errorCount", 0)), int(s.get("warningCount", 0))
          for x in d.get("generalDiagnostics", []):
              if x.get("severity") == "error":
                  print(f"{x['file']}:{x['range']['start']['line'] + 1}: [{x.get('rule', '')}] {x['message']}")
          print(f"basedpyright: {ec} errors, {wc} warnings")
          sys.exit(1 if ec else 0)
          PY

      - name: Smoke imports
        run: python -m scripts.tools smoke_imports

      - name: Verify doc links
        run: python -m scripts.tools verify_doc_links

      - name: Pytest
        run: python -m pytest tests/ -q --tb=short
