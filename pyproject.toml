[project]
name = "sdx"
# PEP 440 package version; docs/README brand the line as **v12**.
version = "12.0.0"
description = "Diffusion Transformer text-to-image training and sampling (DiT, T5, optional triple CLIP)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Install runtime deps with: pip install -r requirements.txt

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["demo", "sample"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "config*",
  "data*",
  "diffusion*",
  "frontier*",
  "models*",
  "pipelines*",
  "research*",
  "toolkit*",
  "training*",
  "utils*",
  "vit_quality*",
  "native*",
]
exclude = ["setup*", "runpod*", "assets*", "datasets*", "tests*", "scripts*", "enhanced_dit*", "external*", "workflows*"]

[project.scripts]
sdx-demo = "demo:main"
sdx-sample = "sample:main"

[project.optional-dependencies]
demo = ["huggingface_hub>=0.20"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = [
  "config",
  "data",
  "diffusion",
  "examples",
  "frontier",
  "models",
  "native/_experimental/python",
  "pipelines",
  "research",
  "scripts",
  "toolkit",
  "training",
  "utils",
  "vit_quality",
]
# Optional / local-only trees — not part of default CI; keeps `ruff check .` green.
exclude = [
  "enhanced_dit",
  "external",
  "model",
  "workflows",
  "design",
  "site",
  ".git",
  "native/mojo",
]

[tool.ruff.lint]
# Expand gradually; B (bugbear) and UP (pyupgrade) catch real footguns on py310+.
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort (auto-fix with `ruff check --fix`)
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line length
  "B008",  # function calls in argument defaults (argparse/common patterns)
  "B904",  # raise from (noisy on existing broad except paths; tighten later)
  "B905",  # zip(..., strict=) — mass behavior change; tighten package-by-package
  "B023",  # loop-var in closure — needs careful per-site review
  "B007",  # unused loop control var — prefer `_` renames in follow-ups
  "E741",  # ambiguous names like `l` in legacy setup scripts
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]  # imports after sys.path tweaks in some tools
"sample.py" = ["E402"]  # repo-root sys.path bootstrap + early --help parser before heavy imports
"train.py" = ["E402"]  # stdio configure before heavy imports; early --help path
"utils/generation/sample_main.py" = ["E402"]  # stdio configure before helper imports
"vit_quality/**" = ["E402"]  # repo-root sys.path bootstrap before utils imports
"setup/**" = ["E402"]  # sys.path bootstrap in setup scripts
"examples/**" = ["E402"]
"demo.py" = ["E402"]
"inference.py" = ["E402"]
"native/_experimental/python/sdx_native/__init__.py" = ["I001"]  # large explicit re-export surface; isort splits combined imports
"utils/native/__init__.py" = ["I001"]  # sys.path bootstrap then star imports
"research/**" = ["E402"]
"pipelines/**" = ["E402"]
"toolkit/**" = ["E402"]
"frontier/**" = ["E402"]
"data/**" = ["E402"]
"models/**" = ["E402"]
"training/**" = ["E402"]
"utils/**" = ["E402"]  # occasional bootstrap / deferred imports after lightweight setup
"tests/**" = ["E402"]
"runpod/**" = ["E402"]
"native/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "native/_experimental/python"]
addopts = "-v --tb=short"
filterwarnings = [
  # SciPy vs NumPy pin mismatch in some envs - not actionable in this repo.
  "ignore:.*NumPy version.*:UserWarning",
  # Triton autotuner deprecations from transitive deps.
  "ignore:warmup, rep, and use_cuda_graph parameters are deprecated:DeprecationWarning",
]
# Skip GPU tests when CUDA is not available (mark with @pytest.mark.cuda).
markers = [
    "cuda: requires a CUDA GPU (skip with -m 'not cuda')",
    "slow: slow tests skipped by default (run with -m slow)",
]

# Pyright / Pylance / basedpyright: ``sdx_native`` lives under ``native/_experimental/python`` (also on ``sys.path`` at runtime).
[tool.pyright]
extraPaths = ["native/_experimental/python", "."]
pythonVersion = "3.10"

[tool.mypy]
python_version = "3.10"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
files = [
  "config/train_config.py",
  "models/lora.py",
  "training/train_args.py",
  "training/train_cli_parser.py",
  "utils/training/part_aware_training.py",
  "utils/terminal.py",
  "utils/generation/sample_cli_parser.py",
  "utils/generation/sample_helpers.py",
]
