[package]
name = "sdx-rs"
version = "0.2.0"
edition = "2021"
description = "SDX native helpers: C ABI cdylib for Python ctypes + JSONL / noise-schedule CLIs"
license = "MIT"

[lib]
name = "sdx_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
md5 = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
