# Standalone workspace root (avoids broken parent native/rust/Cargo.toml).
[workspace]

[package]
name = "sdx-canny-ops"
version = "0.1.0"
edition = "2021"
description = "Fast Canny / soft-edge control maps as a C ABI cdylib for Python ctypes"
license = "MIT"

[lib]
name = "sdx_canny_ops"
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
